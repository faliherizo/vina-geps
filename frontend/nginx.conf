# Limitation de débit (anti-abus / appui DDoS applicatif — exigence MIFI #94).
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;

# Politique de sécurité du contenu des pages (tests d'intrusion du 22 novembre 2026, PT-04 ; ASVS 14.4.3) : une seule
# définition, posée partout où une page HTML part. Aucun script en ligne ; les styles en ligne restent admis (attributs
# style de React) ; blob: sert la visionneuse de PDF et les téléchargements, data: la photo de profil. L'API pose la sienne.
map $request_method $politique_contenu {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# La racine d'un hôte d'organisme (urgence-sante.geps…, ADR 0033) mène à sa connexion : la vitrine et le choix de
# l'organisme n'ont de sens que sur l'hôte commun (VITRINE_HOTE). « * » (défaut) : la vitrine partout, comme avant.
map "$host:${VITRINE_HOTE}" $racine_vers_connexion {
  "~:\*$"          0;
  "~^([^:]+):\1$"  0;
  default          1;
}

server {
  # Port non privilégié : l'image tourne sans root (tests d'intrusion du 22 novembre 2026, IN-01).
  listen 8080;

  # L'adresse réelle du client (IN-05). nginx ne croit X-Forwarded-For que d'un mandataire déclaré (le répartiteur AWS :
  # la plage du VPC) ; ailleurs, l'adresse est celle de la connexion. Il réécrit ensuite l'en-tête vers l'API : un client
  # ne peut plus y glisser une adresse de son choix (l'ancien en-tête ajouté à la chaîne reçue le permettait).
  set_real_ip_from ${API_PROXIES_CONFIANCE};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # Un serveur pour tous les hôtes : en déploiement par sous-domaine (ADR 0033), la racine, www.,
  # admin. et chaque établissement (cssdc.nexus-vinaitsolution.com) arrivent ici ; le backend lit
  # l'hôte transmis (X-Forwarded-Host) et en déduit l'établissement. Le proxy TLS (Traefik) a déjà
  # filtré les hôtes de la racine ; sans lui (poste local), tout hôte entre.
  server_name _;

  # Les redirections restent **relatives** (« Location: /admin/ ») : nginx écoute sur 80 dans son conteneur, et
  # une redirection absolue nommait ce port interne — http://localhost:8095/ menait à http://localhost/admin/,
  # où rien ne répond. Relative, elle garde l'hôte, le port et le schéma du navigateur, derrière Traefik aussi.
  absolute_redirect off;

  # Pièces jointes jusqu'à 50 Mo/document (exigence AO-5338 Global-06). La base64 gonfle le
  # corps JSON (~+37 %) → on autorise 72 Mo. Doit rester aligné avec `express.json({ limit })`.
  client_max_body_size 72m;

  # En-têtes de sécurité (durcissement OWASP — exigence MIFI #94 ; WAF/DDoS au niveau hébergeur).
  add_header X-Content-Type-Options "nosniff" always;
  # Isolation de l'origine (tests d'intrusion FX-AO, ZAP 90004 — Spectre) : nos ressources ne se chargent pas depuis une
  # autre origine (CORP), et une page ouverte par une autre origine n'obtient pas de référence à la nôtre (COOP, sur les
  # documents HTML). L'API garde ses propres en-têtes (PT-05) ; la connexion fédérée passe par redirection, pas par fenêtre.
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Géolocalisation limitée à notre origine : « Mon pointage » lit la position une seule fois, au
  # geste de la personne, pour juger la distance au milieu (AO 26-015-DO, lot R8, E-GP-11).
  add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
  add_header Content-Security-Policy $politique_contenu always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  server_tokens off;

  # Le serveur derrière ce proxy se choisit par l'environnement (API_UPSTREAM, API_PORT) : nginx
  # remplit ce gabarit au démarrage.
  # Résolveur DNS interne de Docker (127.0.0.11). Couplé à un upstream **en variable**, nginx
  # re-résout l'IP du backend **à chaque requête** (TTL 10 s) au lieu de la figer au démarrage :
  # évite les 502 « Bad Gateway » après un redéploiement du conteneur backend (nouvelle IP).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy API → backend (cookie httpOnly conservé via passage propre des en-têtes)
  location /api/ {
    limit_req zone=api_rl burst=40 nodelay;   # rafale tolérée, puis throttling
    set $api_upstream ${API_UPSTREAM};
    proxy_pass http://$api_upstream:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
    # Une seule source par en-tête (PT-05) : l'API pose les siens, plus stricts (DENY, no-referrer, CSP 'none'). Déclarer
    # un add_header ici coupe l'héritage de ceux du serveur ; seul HSTS vient de nginx, celui de l'API étant retiré.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Application (SPA React) sous /admin — page de connexion : /admin/login
  # L'app est buildée avec base "/" : ses assets sont servis depuis /assets/.
  # Routeurs **publics** du serveur, servis hors authentification.
  # Même amont que /api/ : un nom en dur (« backend ») visait, sur un réseau Docker partagé entre plusieurs piles, le
  # premier service de ce nom — celui d'une autre application (déploiement co-hébergé, docs/DEPLOIEMENT-GEPS-OVH.md).
  location /public/ {
    set $public_upstream ${API_UPSTREAM};
    proxy_pass http://$public_upstream:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location /admin {
    root /usr/share/nginx/html;
    try_files $uri @spa_index;
  }

  # Page publique **de l'application** : l'activation d'un compte par invitation. Elle est rendue
  # par la même application à page unique que /admin, sans authentification.
  location ~ ^/invitation/ {
    root /usr/share/nginx/html;
    try_files $uri @spa_index;
  }
  location @spa_index {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    # L'index.html n'est PAS mis en cache par le navigateur : à chaque déploiement il référence
    # de nouveaux assets hachés → l'app se met à jour immédiatement (évite un CSS/JS obsolète).
    # (add_header en location annule l'héritage des en-têtes serveur : on les redéclare.)
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy $politique_contenu always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  # Assets de l'application (base "/") — noms hachés par le build ⇒ cache long & immuable.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # Fichiers de l'application à la racine du site : le travailleur de service des notifications
  # (`/sw.js`, portée `/`), le manifeste d'installation et les icônes, servis avec leur type — un
  # travailleur servi en `text/html` est refusé (« unsupported MIME type »).
  location = /sw.js {
    root /usr/share/nginx/html;
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }
  location /icones/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # La racine est la **vitrine** de VINA GePS (page statique, `public/vitrine/`) : elle présente le
  # produit et sa démonstration filmée, et mène à l'application (/admin/login).
  location = / {
    if ($racine_vers_connexion) { return 302 /admin/login; }
    root /usr/share/nginx/html;
    try_files /vitrine/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy $politique_contenu always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }
  # Le choix de l'organisme : chaque organisme a son hôte (ADR 0033) ; l'hôte commun n'ouvre que les comptes globaux.
  location = /acceder {
    root /usr/share/nginx/html;
    try_files /vitrine/acceder.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy $politique_contenu always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }
  # La vidéo se lit par plages (Range) : le lecteur saute à un chapitre sans tout télécharger.
  location /vitrine/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    # Les sous-titres du film en text/vtt (nosniff refuse une piste servie autrement) ; le reste garde ses types.
    types { video/webm webm; text/vtt vtt; text/html html; text/css css; application/javascript js; image/png png; image/svg+xml svg; image/jpeg jpg; image/webp webp; }
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $politique_contenu always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }
  # Les vidéos de l'aide (une par écran, avec voix et sous-titres) : un fichier absent répond 404, et non la page de
  # l'application ; la lecture par plages laisse sauter à un passage sans tout télécharger.
  location /aide/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    # Les sous-titres doivent partir en text/vtt : avec nosniff, un navigateur refuse une piste servie autrement.
    # Les chapitres de la mise en route (`mise-en-route.chapitres.json`) : lus par le guide pour « Voir dans la vidéo ».
    types { video/webm webm; text/vtt vtt; application/json json; }
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri @spa_index;
  }
}
