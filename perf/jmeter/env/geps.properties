# Environnement GEPS — la démonstration publique https://geps.vinaitsolution.com (VPS OVH partagé, docs/DEPLOIEMENT-GEPS-OVH.md).
#   Lancé par le pipeline « Performance geps » (.github/workflows/perf-geps.yml), ou à la main :
#     printf 'username,password,tenantId,role\nadmin,%s,,admin\n' "$GEPS_ADMIN_PASSWORD" > perf/jmeter/donnees/comptes-geps.local.csv
#     node perf/jmeter/preparer.cjs --env geps && perf/jmeter/lancer.sh geps scenarios -Jtenant=$(cat perf/jmeter/donnees/tenant-geps.txt)
#
# Un seul injecteur, une seule adresse : le frontal limite à 20 requêtes/s par adresse (rafale de 40). Au-delà, la campagne
# mesure la limite (429), pas l'application. Dix utilisateurs avec une seconde de réflexion restent en deçà.
# La démonstration tourne sur un VPS partagé avec une douzaine d'applications : ces seuils mesurent la démo, pas l'AO.
protocole=https
hote=geps.vinaitsolution.com
port=443
# Le compte système de la campagne (`admin` du premier démarrage) : écrit par le pipeline depuis le secret GEPS_ADMIN_PASSWORD.
comptes=donnees/comptes-geps.local.csv
identifiants=donnees/identifiants-geps.csv
# L'établissement « Charge … » de la campagne : vide = créé par preparer.cjs (PERF_TENANT le reprend d'une campagne précédente).
tenant=
# Charge : utilisateurs virtuels, montée (s), durée (s), temps de réflexion entre deux requêtes (ms).
utilisateurs=10
montee=20
duree=180
reflexion=1000
# Une démonstration se sème : les écritures sont admises, dans l'établissement de campagne seulement.
ecritures=true
# Accord de niveau de service par opération (operations/*.jmx) : débit fixe sous la limite du frontal.
debit=10
unites_operation=5
duree_operation=180
# Seuils (ms) : durée maximale d'une requête (assertion) par classe, Apdex satisfait / toléré.
seuil_lecture=800
seuil_ecriture=1500
seuil_rapport=3000
apdex_satisfait=800
apdex_tolere=2000
