# Environnement LOCAL — le jar Java sur un port privé (jamais la pile Docker :4000 / :8081).
#   backend-java/scripts/campagne-e2e.sh lance le Java sur 4020 ; ou : java -jar … --server.port=4020
# Chaque clé se surcharge à la ligne de commande : jmeter … -Jhote=… -Jutilisateurs=…
protocole=http
hote=localhost
port=4020
# Comptes et données : voir donnees/*.csv (chemins relatifs au dossier perf/jmeter).
comptes=donnees/comptes.csv
identifiants=donnees/identifiants.csv
# Établissement des comptes système (en-tête X-Tenant-Id) ; vide pour un compte d'établissement.
tenant=default
# Charge : utilisateurs virtuels, montée (s), durée (s), temps de réflexion entre deux requêtes (ms).
utilisateurs=20
montee=10
duree=60
reflexion=1000
# Les écritures (POST/PUT/PATCH/DELETE) sont jouées : sur une base jetable seulement.
ecritures=true
# Accord de niveau de service par opération (operations/*.jmx) : débit fixe (requêtes/s), unités qui le portent, durée de référence (s).
debit=20
unites_operation=10
duree_operation=600
# Seuils (ms) : durée maximale d'une requête (assertion) par classe, Apdex satisfait / toléré.
seuil_lecture=500
seuil_ecriture=1000
seuil_rapport=2000
apdex_satisfait=500
apdex_tolere=1500
