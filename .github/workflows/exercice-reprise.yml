# Exercice de reprise après sinistre (AO 26-015-DO, P-TN-3) : restaure la dernière copie de la démonstration dans une
# pile isolée du serveur, vérifie qu'elle sert (intégrité, santé, connexion, lecture), mesure RPO et RTO, puis détruit
# la pile. Chaque trimestre et à la demande ; le rapport est joint à l'exécution et gardé sur le serveur.
# Plan, objectifs et registre des exercices : docs/securite/PLAN-CONTINUITE-REPRISE.md.
name: Exercice de reprise

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 1 1,4,7,10 *"

concurrency:
  group: deployer-geps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exercice:
    name: Reprise — geps-demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: geps-demo
    steps:
      - name: Clé SSH du serveur
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/geps && chmod 600 ~/.ssh/geps
          printf '%s\n' "$HOTES" > ~/.ssh/known_hosts
          printf 'Host geps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/geps\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Exercice
        run: |
          set -o pipefail
          ssh geps "cd ~/projets/vina-geps && deploy/geps/exercice-reprise.sh" | tee rapport.md
      - if: always()
        run: cat rapport.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
