# Gabarit DevSecOps — SECRETS. Réutilisable (workflow_call) : orchestrateur devsecops.yml, déploiements.
#   gitleaks : tout l'historique Git, nouvelles fuites seulement (référence securite/gitleaks-reference.json) ;
#   Trivy    : l'arborescence livrée (un secret collé dans un fichier non encore commité dans l'historique d'une PR).
name: "Gabarit — secrets"

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (historique et arborescence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/gitleaks
      - uses: ./.github/actions/trivy
        with: { commande: fs, cible: ".", scanners: secret }
