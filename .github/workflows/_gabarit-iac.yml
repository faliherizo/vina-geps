# Gabarit DevSecOps — INFRASTRUCTURE (IaC). Terraform, Dockerfiles, compositions Docker, manifestes : mauvaises
# configurations élevées ou critiques. Une exemption se justifie au-dessus de la ressource (#trivy:ignore:<ID> — raison).
name: "Gabarit — infrastructure"

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  iac:
    name: Infrastructure (Trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trivy
        with: { commande: config, cible: ".", ignorer-sans-correctif: "false", rapport: trivy-iac.sarif }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sarif-iac, path: trivy-iac.sarif, if-no-files-found: ignore }
