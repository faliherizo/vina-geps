# VINA GePS — déploiement continu de la démonstration https://geps.vinaitsolution.com (VPS OVH partagé).
#
#   secrets           : _gabarit-secrets.yml — gitleaks (historique) et Trivy (arborescence), avant toute construction.
#   construire-livrer : les deux images construites ici (jamais sur le VPS, qui héberge une douzaine d'applications),
#                       analysées par Trivy (bloquant) avec leur SBOM, chargées sur le serveur par SSH (docker save | docker load : aucun registre à ouvrir), puis
#                       deploy/geps/deployer.sh — sauvegarde, démarrage, santé, retour arrière automatique.
#   semer             : semer-demo.yml — les organismes de démonstration et leurs comptes publiés (rien n'est doublé).
#   recette           : recette-e2e.yml — la pile déployée, en lecture seule : le superadmin, l'API, chaque compte publié.
#   tls               : tls.yml — balayage TLS de l'hôte commun et de chaque sous-domaine d'organisme (E-TN-8).
# La performance (perf.yml) se lance à part, à la main : elle charge un serveur partagé.
#
# Déclenché à chaque poussée sur develop (la démonstration montre la version en cours), ou à la main (Actions › Run).
# Secrets du dépôt (livraison OVH) : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Environnement GitHub geps-demo : APP_URL, COMPTES_DEMO, PERF_PROFIL ; SUPERADMIN_PASSWORD, PERF_COMPTE_PASSWORD.
# Détail : docs/DEPLOIEMENT-GEPS-OVH.md §3, et docs/PIPELINES-ENVIRONNEMENTS.md pour un nouvel environnement (Azure).
name: Déployer geps (démonstration)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      semer:
        description: "Semer les organismes de démonstration après le déploiement"
        type: boolean
        default: true
      forcer_semis:
        description: "Semer un nouvel exemplaire horodaté des démonstrations Urgences-santé et FX-AO, même s'il en existe un"
        type: boolean
        default: false

# Deux déploiements ne se chevauchent jamais ; le second attend le premier au lieu de l'interrompre à mi-chemin.
concurrency:
  group: deployer-geps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # DevSecOps : un secret qui fuit ne part pas en démonstration publique (gabarit commun avec devsecops.yml).
  secrets:
    uses: ./.github/workflows/_gabarit-secrets.yml

  construire-livrer:
    name: Construire, analyser, livrer, déployer
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: geps-demo
      url: https://geps.vinaitsolution.com
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Image du serveur Java
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend-java/Dockerfile
          load: true
          tags: vina-geps/backend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=geps-backend
          cache-to: type=gha,scope=geps-backend,mode=max
      - name: Image de l'interface (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: vina-geps/web:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=geps-web
          cache-to: type=gha,scope=geps-web,mode=max
      # DevSecOps : une image dont une vulnérabilité élevée ou critique a un correctif ne quitte pas l'exécuteur.
      - name: Analyse de l'image du serveur Java (Trivy, SBOM)
        uses: ./.github/actions/trivy
        with: { commande: image, cible: "vina-geps/backend:${{ steps.version.outputs.version }}", sbom: sbom-backend.cdx.json }
      - name: Analyse de l'image de l'interface (Trivy, SBOM)
        uses: ./.github/actions/trivy
        with: { commande: image, cible: "vina-geps/web:${{ steps.version.outputs.version }}", sbom: sbom-web.cdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: "sbom-${{ steps.version.outputs.version }}", path: "*.cdx.json" }
      - name: Clé SSH du déploiement
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/geps && chmod 600 ~/.ssh/geps
          printf '%s\n' "$HOTES" > ~/.ssh/known_hosts
          printf 'Host geps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/geps\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Livrer les images au serveur
        run: |
          V=${{ steps.version.outputs.version }}
          docker save "vina-geps/backend:$V" "vina-geps/web:$V" | gzip -1 | ssh geps 'gunzip | docker load'
      # Le serveur ne prend du dépôt que deploy/geps (composition et scripts) ; les images viennent d'ici.
      - name: Déployer
        run: |
          ssh geps "set -e; cd ~/projets/vina-geps && git fetch --quiet origin && git checkout --quiet --force --detach ${GITHUB_SHA} \
            && deploy/geps/deployer.sh ${{ steps.version.outputs.version }}"
      - name: La version servie est la bonne
        run: |
          for i in $(seq 1 30); do curl -fsS "${{ vars.APP_URL }}/api/health" && exit 0; sleep 5; done; exit 1


  # Les deux étapes suivantes ne sont PAS propres à OVH : ce sont les pipelines réutilisables, paramétrés par
  # l'environnement GitHub (geps-demo : APP_URL, COMPTES_DEMO, SUPERADMIN_PASSWORD…). Un déploiement Azure les appellera
  # de la même façon, avec son propre environnement.
  semer:
    name: Semer
    needs: construire-livrer
    if: github.event_name == 'push' || inputs.semer
    uses: ./.github/workflows/semer-demo.yml
    with:
      environnement: geps-demo
      forcer: ${{ inputs.forcer_semis == true }}
    secrets: inherit

  recette:
    name: Recette
    needs: [construire-livrer, semer]
    if: always() && needs.construire-livrer.result == 'success' && needs.semer.result != 'failure'
    uses: ./.github/workflows/recette-e2e.yml
    with:
      environnement: geps-demo
    secrets: inherit

  tls:
    name: Balayage TLS
    needs: construire-livrer
    if: needs.construire-livrer.result == 'success'
    uses: ./.github/workflows/tls.yml
    with:
      environnement: geps-demo
    secrets: inherit
