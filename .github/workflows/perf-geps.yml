# VINA GePS — campagne de performance JMeter contre la démonstration https://geps.vinaitsolution.com.
#
# Lancée à la main (Actions › Performance geps › Run workflow) : une campagne charge un VPS partagé avec d'autres
# applications, elle ne part donc jamais toute seule. Elle sème ses données dans son propre établissement « Charge … »
# (repris d'une campagne à l'autre), joue le plan choisi, puis rend le verdict SLO de perf/jmeter/analyser.cjs — le job
# échoue si un objectif est manqué. Rapports (tableau de bord HTML, RESULTATS.md) : artefact « rapports-perf-geps ».
#
# Un seul injecteur = une seule adresse : le frontal plafonne à 20 requêtes/s par adresse. Garder utilisateurs ×
# (1000 / réflexion) sous ce seuil, sinon la campagne mesure des 429 (perf/jmeter/env/geps.properties).
name: Performance geps

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan : scenarios | endpoints | operations | scenarios/sonde-lecture.jmx | plans/endpoints-effectifs.jmx …"
        type: string
        default: scenarios
      utilisateurs:
        description: "Utilisateurs virtuels"
        type: string
        default: "10"
      duree:
        description: "Durée (s)"
        type: string
        default: "180"

concurrency:
  group: perf-geps
  cancel-in-progress: false

permissions:
  contents: read

env:
  JMETER_VERSION: "5.6.3"

jobs:
  campagne:
    name: JMeter contre geps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: JMeter, zsh, pandoc
        run: |
          sudo apt-get update && sudo apt-get install -y zsh pandoc
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Compte de campagne (depuis les secrets)
        env:
          MDP: ${{ secrets.GEPS_ADMIN_PASSWORD }}
        run: printf 'username,password,tenantId,role\nadmin,%s,,admin\n' "$MDP" > perf/jmeter/donnees/comptes-geps.local.csv
      - name: Préparer les données
        run: |
          # L'établissement d'une campagne précédente, retrouvé par son nom : une campagne n'en laisse pas un de plus.
          export PERF_TENANT="$(curl -fsS https://geps.vinaitsolution.com/api/auth/tenants \
            | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const t=l.filter(x=>x.name.startsWith("Charge ")).sort((a,b)=>b.name.localeCompare(a.name))[0];process.stdout.write(t?t.id:"")')"
          node perf/jmeter/preparer.cjs --env geps --lignes 3
      - name: Campagne et verdict SLO
        run: |
          perf/jmeter/lancer.sh geps "${{ inputs.plan }}" -Jtenant="$(cat perf/jmeter/donnees/tenant-geps.txt)" \
            -Jutilisateurs="${{ inputs.utilisateurs }}" -Jduree="${{ inputs.duree }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rapports-perf-geps, path: perf/jmeter/rapports/geps }
