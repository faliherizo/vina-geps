# Port distinct du backend Node (4000/4001) : les deux tournent en parallèle pendant la migration.
server.port=${PORT:4002}

# Jackson doit reproduire la serialisation de JSON.stringify, pas celle qu'il prefere.
# `always` ecrit les cles nulles : le front teste parfois la presence d'une cle, et
# `{a: null}` n'est pas le meme contrat que `{}`.
# (Les options de dates seront ajoutees quand un module migre en serialisera ; Jackson 3
# les a deplacees de SerializationFeature vers DateTimeFeature.)
spring.jackson.default-property-inclusion=always

# Le front envoie ses cookies : l'origine doit etre explicite, jamais '*' avec credentials.
nexu.cors.origines=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Environnement d'essai (campagne e2e) : autorise la route destructive POST /api/auth/_reset et la boîte
# d'envoi GET /api/auth/_outbox, refusées partout ailleurs.
nexu.essai=${NEXU_ESSAI:false}
# Résolution de l'établissement (ADR 0033) : « selecteur » (l'écran de connexion propose les établissements)
# ou « sous_domaine » (cssdc.nexus-vinaitsolution.com est l'établissement CSSDC ; exige DOMAINE_RACINE).
nexu.tenant.resolution=${TENANT_RESOLUTION:selecteur}
nexu.domaine.racine=${DOMAINE_RACINE:}
nexu.sous-domaines.reserves=${SOUS_DOMAINES_RESERVES:}
# L'adresse publique commune des liens sortants, quand le déploiement n'a pas de sous-domaines.
nexu.url.publique=${PUBLIC_APP_URL:}

# Table de routage exposee sur /api/_migration/routes — outil de suivi de la migration.
# Exposer sa propre carte des routes aide la reconnaissance : a laisser a false hors developpement.
nexu.migration.exposer-routes=${EXPOSER_ROUTES:false}

# ── Base de donnees ────────────────────────────────────────────────────────
# Le MEME fichier que le backend Node pendant l'etranglement : les deux processus partagent
# l'etat. SQLite est en mode WAL (pose par le Node), qui autorise l'acces concurrent.
spring.datasource.url=${DB_URL:jdbc:sqlite:data/urgences-sante.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Un seul ecrivain a la fois en SQLite : le pool est volontairement etroit, et l'attente du
# verrou explicite. Un pool large ne ferait qu'echouer plus vite et plus souvent.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
# Une transaction qui commence en lecture (BEGIN DEFERRED) puis ecrit ne peut pas attendre le verrou :
# si un autre ecrivain a commis entre-temps, SQLite repond SQLITE_BUSY sur-le-champ, busy_timeout ou
# non — vu en campagne de charge (20 usagers, POST /api/payroll/absence-requests : 3 % de 500).
# BEGIN IMMEDIATE prend le verrou d'ecriture d'entree et attend sa place ; l'attente remplace l'erreur.
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
# Journal WAL : un lecteur ne bloque pas l'écrivain, ni l'inverse. Sans lui (mode « delete », celui d'une
# base neuve), la copie par organisme qui suit la sauvegarde tient la base plusieurs secondes et les requêtes
# simultanées reçoivent SQLITE_BUSY — vu en campagne e2e. Le mode est persistant : posé une fois, il reste.
spring.datasource.hikari.data-source-properties.journal_mode=WAL

# Liquibase en BASELINE : il constate le schema bati par les 35 migrations du Node, il ne le
# rejoue pas. Voir db/changelog/0000-baseline.xml.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}

# Secret de session, partage avec le backend Node pendant l'etranglement.
# Au moins 32 octets : la RFC 7518 §3.2 l'exige pour HS256 et le Java refuse de demarrer en deca
# (voir JetonDeSession). Le defaut ci-dessous n'est utilisable qu'en developpement.
nexu.jwt.secret=${JWT_SECRET:developpement-uniquement-secret-de-32-octets-min}
# Le cookie de session est marque Secure en production ; COOKIE_SECURE=0 permet le HTTP local, comme cote Node.
nexu.cookie.secure=${COOKIE_SECURE:false}

# L'adresse a laquelle ce serveur se joint lui-meme (mocks de demonstration, retours SSO) :
# celle qu'un navigateur atteint. Sans MOCK_URL_BASE, son propre port.
nexu.url.serveur=${MOCK_URL_BASE:http://localhost:${PORT:4002}}

# Cadence de la boucle de l'ordonnanceur (taches differees, webhooks sortants), comme ORDONNANCEUR_INTERVALLE_MS cote Node.
nexu.ordonnanceur.intervalle-ms=${ORDONNANCEUR_INTERVALLE_MS:60000}

# Synchronisation GRICS : cadence du passage planifie, comme GRICS_INTERVALLE_MIN cote Node.
nexu.grics.intervalle-minutes=${GRICS_INTERVALLE_MIN:15}

# ── Pare-feu applicatif (exigence 32) ──────────────────────────────────────
nexu.waf.mode=${WAF_MODE:}
nexu.waf.requetes-par-minute=${WAF_REQUETES_PAR_MINUTE:}
nexu.waf.echecs-connexion=${WAF_ECHECS_CONNEXION:}
nexu.waf.verrou-minutes=${WAF_VERROU_MINUTES:}
nexu.https=${HTTPS:false}

# ── Sauvegardes (grille 47) — memes variables que le Node ─────────────────
nexu.sauvegardes.dossier=${SAUVEGARDES_DOSSIER:}
nexu.sauvegardes.retention-incrementale=${SAUVEGARDES_RETENTION_INCREMENTALE:}
nexu.sauvegardes.retention-complete=${SAUVEGARDES_RETENTION_COMPLETE:}
nexu.sauvegardes.intervalle-min=${SAUVEGARDES_INTERVALLE_MIN:}
nexu.sauvegardes.complete-intervalle-min=${SAUVEGARDES_COMPLETE_INTERVALLE_MIN:}
nexu.version=${NEXU_VERSION:0.1.0}
nexu.donnees.dossier=${NEXU_DONNEES:data}
# Où se range le contenu des pièces jointes de la messagerie : « base » (dans la base, qui le suit dans chaque
# sauvegarde et copie par organisme) ou « volume » (fichiers sous NEXU_DONNEES/pieces-jointes — sur AWS, l'EFS).
nexu.pieces-jointes.stockage=${PIECES_JOINTES_STOCKAGE:base}

# ── Assistant IA — Claude si la cle est posee, sinon Ollama si son adresse l'est ──
nexu.ia.anthropic.cle=${ANTHROPIC_API_KEY:}
nexu.ia.anthropic.modele=${ANTHROPIC_MODEL:}
nexu.ia.ollama.url=${OLLAMA_URL:}
nexu.ia.ollama.active=${AI_ENABLE_OLLAMA:false}
nexu.ia.ollama.modele=${OLLAMA_MODEL:}
nexu.ia.ollama.num-predict=${OLLAMA_NUM_PREDICT:512}
nexu.ia.delai-ms=${AI_TIMEOUT_MS:180000}
# Antivirus des pièces téléversées : ClamAV (protocole INSTREAM) dès que CLAMD_HOTE est posé, simulateur EICAR sinon.
nexu.antivirus.clamd.hote=${CLAMD_HOTE:}
nexu.antivirus.clamd.port=${CLAMD_PORT:3310}

# ── Journal (ADR 0041, docs/JOURNALISATION.md) ─────────────────────────────
# Le niveau et le format viennent du yml (LOG_NIVEAU, LOG_NIVEAU_RACINE, LOG_FORMAT) et sont relayes
# par ConfigurationJournal (EnvironmentPostProcessor) : une valeur inconnue arrete le demarrage en la
# nommant. Rien ici n'est un niveau en dur ; la retention du journal des actions se lit de meme.
# JOURNAL_ACTIONS_RETENTION_JOURS : 365 par defaut, 0 = pas de purge (lu par FiltreJournalisation).

# Minimum facturable par mois du bordereau FX-AO-20260810 (contrat 3.03) : au-dessus, seuls les utilisateurs actifs comptent (ST-H01).
alertes.facturation.minimum-utilisateurs=${ALERTES_MINIMUM_FACTURABLE:100}

# FX-AO-20260810, annexe 10.18.04 C : la personne autorisée qui signe l'attestation de destruction, son employeur
# (le fournisseur) et l'adresse de son bureau principal. Vides, l'annexe refuse de se produire (409) en les nommant.
saas.attestation.signataire=${SAAS_ATTESTATION_SIGNATAIRE:}
saas.attestation.fournisseur=${SAAS_ATTESTATION_FOURNISSEUR:}
saas.attestation.adresse=${SAAS_ATTESTATION_ADRESSE:}
