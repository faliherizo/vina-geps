# ── VINA GePS — démonstration (geps.vinaitsolution.com) ─────────────────────────────────────────
# Bloc du Nginx central (~/vina-cms/nginx/prod.conf, conteneur vina_nginx). Ajouter aussi
# `geps.vinaitsolution.com` au server_name du bloc `listen 80` (défi ACME, puis redirection HTTPS).
#
# Certificat propre à ce nom (lignée geps.vinaitsolution.com) : l'émettre n'a pas à toucher la liste du certificat
# partagé, dont un `--expand` mal dérivé retirerait d'autres sites (docs/DEPLOIEMENT-GEPS-OVH.md §3).
#
# L'amont passe par une variable : nginx le résout à chaque requête (resolver Docker en tête de prod.conf). Sans elle,
# `nginx -t` échouerait — et tous les sites du VPS avec lui — dès que geps-web est arrêté.
server {
    listen 443 ssl;
    http2 on;
    server_name geps.vinaitsolution.com;

    ssl_certificate     /etc/letsencrypt/live/geps.vinaitsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geps.vinaitsolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Aucun add_header ici : geps-web pose déjà tous les en-têtes de sécurité, HSTS compris (frontend/nginx.conf), et
    # l'API les siens. Les répéter les doublerait dans chaque réponse.

    # Pièces jointes jusqu'à 50 Mo en base64 : aligné sur client_max_body_size de frontend/nginx.conf.
    client_max_body_size 72m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $geps_web geps-web:8080;
        proxy_pass http://$geps_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les rapports et la génération assistée peuvent dépasser la minute par défaut.
        proxy_read_timeout 300s;
    }
}
